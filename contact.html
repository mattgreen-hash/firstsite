<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Inquiry - Kingdom Prep</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <img src="images/cropped-cropped-KP-Web-Header-2.png" alt="Kingdom Prep Lutheran High School Logo" class="logo">
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="student-life.html">Student Life</a></li>
            <li><a href="contact.html" class="active">Inquiry Form</a></li>
        </ul>
    </nav>
</header>

<main>
    <h1>Inquiry & Admissions Form</h1>
    <p>Interested in joining the brotherhood at Kingdom Prep? Submit your information below to learn more.</p>

    <!-- Container for JavaScript confirmation output -->
    <div id="confirmation-container"></div>

    <!-- Submission Form -->
    <form id="inquiry-form">
        <div class="form-group">
            <label for="studentName">Prospective Student / Guardian Name:</label>
            <input type="text" id="studentName" name="studentName" required placeholder="Enter full name">
        </div>

        <div class="form-group">
            <label for="email">Contact Email:</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label for="gradeLevel">Anticipated Grade Level:</label>
            <select id="gradeLevel" name="gradeLevel" required>
                <option value="" disabled selected>Select a grade</option>
                <option value="9th">9th Grade</option>
                <option value="10th">10th Grade</option>
                <option value="11th">11th Grade</option>
                <option value="12th">12th Grade</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Questions or Areas of Interest:</label>
            <textarea id="notes" name="notes" rows="4" placeholder="Tell us about sports, academics, or programs you want to know about..."></textarea>
        </div>

        <button type="submit">Submit Inquiry</button>
    </form>
</main>

<footer>
    <p>&copy; 2026 Kingdom Prep Lutheran High School. Educational Sample Site.</p>
</footer>

<!-- Link to the separate JavaScript file -->
<script src="script.js"></script>
</body>
</html>
